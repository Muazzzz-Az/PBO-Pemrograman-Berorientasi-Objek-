<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

  <meta name="theme-color" content="#4A9FBF" />

  <meta name="description" content="CreartsI" />
  <meta name="keywords" content="komisi seni, art commission, illustrator indonesia, vtuber, live2d, custom avatar" />
  <meta name="author" content="CreartsI" />

  <!-- Open Graph untuk social media preview -->
  <meta property="og:title" content="CreartsI - Platform Komisi Seni Indonesia" />
  <meta property="og:description" content="Rumah komisi terbaik untuk kreator Indonesia" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="%PUBLIC_URL%/logo512.png" />

  <!-- Font preconnect untuk loading lebih cepat -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin="anonymous" />

  <!-- Google Fonts: Plus Jakarta Sans, Poppins, Inter -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
  <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

  <title>CreartsI - Platform Komisi Artis Indonesia</title>

  <style>
    /* Reset dasar sebelum CSS React load - mencegah FOUC (Flash of Unstyled Content) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      font-size: 16px;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    @media (max-width: 600px) {
      html {
        font-size: 14px;
      }
    }

    @media (min-width: 1400px) {
      html {
        font-size: 18px;
      }
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Poppins', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #F2F7F9;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
  </style>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
</body>
</html>
